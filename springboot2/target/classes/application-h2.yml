server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:mem:employee_db2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, info